<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2fb" id="themeColorMeta">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/appicon.png">
<title>剪贴板</title>
<script>
/* 主题：默认跟随系统；用户手动切换后记在 localStorage，之后按用户设置展示。
   这段内联脚本放在 <head> 里、样式表之前，确保首帧就是正确主题、不闪白/闪黑 */
(function(){
  try{
    var m = localStorage.getItem('lanoclip-theme') || 'system';
    var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    // iOS 顶部状态栏/地址栏配色跟随实际主题（手动切换时也必须跟着变）
    var tc = document.getElementById('themeColorMeta');
    if (tc) tc.setAttribute('content', dark ? '#0f1626' : '#eef2fb');
  }catch(e){ /* 隐私模式等场景下 localStorage 不可用，退回默认亮色 */ }
})();
</script>
<style>
  /* 亮色为默认，跟随系统切换到暗色（@media prefers-color-scheme） */
  :root{
    color-scheme:light dark;
    --bg1:#eef2fb; --bg2:#e3e9f7; --bg3:#cfe0ff; --glow:#dbe7ff;
    --glass:rgba(255,255,255,.62);
    --glass-strong:rgba(255,255,255,.80);
    --stroke:rgba(17,24,39,.10);
    --text:#111a2e; --muted:#5a6684;
    --primary:#3b82f6; --primary2:#2563eb;
    --danger:#ef4444; --danger2:#dc2626;
    --shadow:rgba(17,24,39,.14);
    --overlay:rgba(17,24,39,.38);
    --toast-bg:rgba(22,29,48,.92); --toast-text:#fff;
    --radius:16px;
    /* 毛玻璃背景光斑：亮色下用低饱和的蓝/紫/粉/青，
       既给 backdrop-filter 提供可模糊的内容，又不会刺眼 */
    --blob-a:rgba(147,197,253,.75);
    --blob-b:rgba(196,181,253,.62);
    --blob-c:rgba(249,208,232,.50);
    --blob-d:rgba(153,246,228,.42);
    /* 图片 tab 固定高度：PC 默认 200px（主流桌面 1920×1080、4 列布局）；
       H5 在下方按 body.is-h5 覆盖为 240px（主流手机 390×844、单列满宽）。
       JS 也读这个值，避免两处写死不一致 */
    --shot-h:200px;
  }
  /* 暗色：由 <html data-theme="dark"> 驱动（head 内联脚本设置），
     默认跟随系统、用户手动切换后按用户设置，不再直接跟随 prefers-color-scheme */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg1:#1b2440; --bg2:#0f1626; --bg3:#3a2a55; --glow:#22345e;
    /* 暗色玻璃用「深墨蓝半透明」而不是「白色半透明」：
       iOS Safari 对 backdrop-filter 的采样不稳定，白色半透明层在暗底上
       常被渲染成发白的浅色块（表现为二维码/复制按钮「还是亮色」）。
       用深色底无论模糊是否生效，按钮和卡片都是暗的 */
    --glass:rgba(30,42,68,.62);
    --glass-strong:rgba(44,59,92,.78);
    --stroke:rgba(255,255,255,.18);
    --text:#f2f5ff; --muted:#a9b3cf;
    --shadow:rgba(0,0,0,.34);
    --overlay:rgba(6,10,20,.62);
    --toast-bg:rgba(20,26,44,.92); --toast-text:#fff;
    /* 暗色下光斑换成低亮度霓虹色，玻璃上的文字依旧清晰 */
    --blob-a:rgba(59,130,246,.26);
    --blob-b:rgba(139,92,246,.24);
    --blob-c:rgba(236,72,153,.18);
    --blob-d:rgba(45,212,191,.16);
  }
  /* H5 单列满宽（列宽约 340px），图片固定高度比 PC 更高，窄屏也能看清内容 */
  body.is-h5{ --shot-h:240px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* hidden 属性必须能压住 .btn 的 display，否则带 hidden 的按钮仍会显示 */
  .btn[hidden]{display:none;}
  /* html 定高、body 用 min-height：若 body 也 height:100%，内容溢出时
     body 的 padding-bottom 不会被计入滚动高度，底部元素就会「吸」在窗口底边 */
  html{margin:0;padding:0;height:100%;}
  body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:radial-gradient(1100px 700px at 10% -10%,var(--blob-a),transparent 62%),
               radial-gradient(950px 650px at 95% 2%,var(--blob-b),transparent 58%),
               radial-gradient(850px 650px at 80% 92%,var(--blob-c),transparent 60%),
               radial-gradient(750px 560px at 6% 88%,var(--blob-d),transparent 62%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    min-height:100%;
    padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 34px);
    -webkit-font-smoothing:antialiased;
  }
  /* 头部：图标 + 标题 + 介绍，整体居中 */
  header{text-align:center;margin:2px 4px 12px;}
  .hero-icon{width:76px;height:76px;display:block;margin:0 auto 10px;border-radius:20px;
             box-shadow:0 10px 24px var(--shadow);}
  header h1{font-size:20px;margin:0;letter-spacing:.5px;font-weight:600;}
  .hero-desc{font-size:12.5px;color:var(--muted);margin:7px auto 0;line-height:1.55;white-space:nowrap;}

  /* 顶部 tab：文本 / 图片，位于访问地址卡片下方、与计数/清空同排 */
  .tabs{
    display:inline-flex;gap:4px;padding:4px;margin:0;
    background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 6px 20px var(--shadow);
  }
  .tab{
    appearance:none;-webkit-appearance:none;border:none;background:transparent;color:var(--muted);
    font-size:14px;font-weight:600;padding:7px 16px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:background .15s ease,color .15s ease;
  }
  .tab:active{transform:scale(.97);}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
  .tab-badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;min-width:18px;text-align:center;
             background:var(--glass-strong);color:var(--muted);}
  .tab-badge:empty{display:none;}
  .tab.active .tab-badge{background:rgba(255,255,255,.24);color:#fff;}
  /* 切换卡长度与访问地址卡片严格等宽（--feed-w 由 JS 测量 .share 写入），PC/H5 一致；
     两个 tab 均分整条宽度呈分段控件式布局；tabs 是 toolbar 的 flex item，
     窄窗口下 flex-shrink 自动收缩，不会撑爆工具栏 */
  .tabs{width:var(--feed-w,auto);}
  .tab{flex:1;justify-content:center;}
  /* 主题切换：PC 上收回工具栏与设置并排；仅 H5 固定在页面右上角
     （手机屏幕窄，fixed 不占工具栏空间），safe-area 适配刘海屏 */
  body.is-h5 #themeBtn{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 12px);
    right:calc(env(safe-area-inset-right) + 12px);
    z-index:50;
  }

  .card{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:0 8px 30px var(--shadow);
  }
  /* 访问地址：卡片按内容宽度收缩并居中（不拉满页面），左右图标紧贴 URL */
  .share{padding:10px 14px;margin:0 auto 10px;width:fit-content;max-width:100%;}
  .share-row{display:flex;align-items:center;justify-content:center;gap:6px;}
  .url{
    flex:0 1 auto;min-width:0;text-align:center;font-size:15px;font-weight:600;letter-spacing:.3px;
    overflow-wrap:anywhere;word-break:break-all;line-height:1.35;
  }

  .btn{
    appearance:none;-webkit-appearance:none;border:1px solid var(--stroke);background:var(--glass-strong);color:var(--text);
    font-size:14px;font-weight:600;padding:9px 14px;border-radius:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease,background .15s ease,opacity .15s ease;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
  }
  .btn:active{transform:scale(.96);}
  .btn.icon{padding:9px;width:40px;justify-content:center;}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:8px;font-weight:600;}
  .btn svg{width:18px;height:18px;display:block;}
  /* 主题切换图标：亮色显示太阳、暗色显示月亮。
     选择器必须带上 .btn（特异性 0,2,0）才能压住上面的 .btn svg{display:block} */
  .btn .icon-moon{display:none;}
  :root[data-theme="dark"] .btn .icon-sun{display:none;}
  :root[data-theme="dark"] .btn .icon-moon{display:block;}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;}
  .btn.danger{background:linear-gradient(135deg,var(--danger),var(--danger2));border-color:transparent;}
  .btn.block{width:100%;justify-content:center;padding:12px;font-size:15px;}
  .btn.done{background:linear-gradient(135deg,#16a34a,#15803d);border-color:transparent;}

  /* 左右两翼 flex:1 且 flex-basis:0，两侧等宽，tab 永远居中
     （若用 1fr 栅格，左侧计数过宽会把中间挤偏） */
  .toolbar{display:flex;align-items:center;gap:10px;margin:0 4px 8px;}
  .tb-side{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;}
  /* 右侧两个操作按钮（主题切换 / 设置）之间留出间距，避免挤在一起；
     gap 只作用于实际渲染的子元素，按钮 hidden 时不会产生多余空隙 */
  .tb-side.right{justify-content:flex-end;gap:12px;}
  .toolbar .tabs{flex:0 0 auto;}
  .toolbar .count{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 手机端隐藏计数：tab 角标已显示同样数字，去掉后 tab 严格居中 */
  body.is-h5 .toolbar .count{display:none;}

  /* 列表：PC 宽屏四列（每页 32 条 = 4 列 × 8 行），窄窗口与 H5 递减列数。
     align-items:start 让每张卡保持自身高度，不被同行卡片拉伸 */
  .list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:8px;align-items:start;}
  .list.cols-4{grid-template-columns:1fr;}
  @media (min-width:820px){
    .list.cols-4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  }
  @media (min-width:1040px){
    .list.cols-4{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  }
  /* 记录卡片：独立的毛玻璃小砖——半透明底 + 细描边 + 背景模糊。
     放在彩色光斑背景上，玻璃质感才看得出来；圆角统一 14px，
     图片 tab 的高度由 .shot 固定，不受卡片内边距影响 */
  .item{padding:7px 11px 8px;display:flex;flex-direction:column;gap:5px;
        background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
        box-shadow:0 6px 18px var(--shadow);
        backdrop-filter:blur(16px) saturate(150%);
        -webkit-backdrop-filter:blur(16px) saturate(150%);
        animation:in .18s ease;}
  @keyframes in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  /* 时间与「展开/复制」同排，整卡更矮，一屏能放更多条 */
  .item-head{display:flex;align-items:center;gap:8px;min-height:22px;}
  .time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .content{
    margin:0;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
  }
  /* 默认只保留一行，超出一行由「展开」放开 */
  .content.clamp{max-height:1.5em;overflow:hidden;}
  .content.open{max-height:none;overflow:visible;}
  /* 图片 tab：所有缩略图固定同一高度（PC/H5 不同），网格不再一高一低；
     contain 保证任何比例的图片都完整可见，不裁切内容；
     完整高度超出固定高度的图，由 JS 显示「展开」看全图 */
  .shot{display:block;width:100%;height:var(--shot-h);object-fit:contain;object-position:center;
        border-radius:8px;background:rgba(127,127,127,.14);}
  /* 图片元素也带 content/clamp 类（与文本共用一套开关类），
     必须压住 .content.clamp 的 1.5em 行高收起，否则图片会被切成一行高 */
  .shot.clamp{max-height:none;overflow:visible;}
  .shot.open{height:auto;object-fit:contain;}
  a.btn{text-decoration:none;}
  .toggle{background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px;white-space:nowrap;}
  .toggle[hidden]{display:none;}
  .spacer{flex:1;}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:48px 0;
        background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
        backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .empty[hidden]{display:none;}

  /* H5：上滑加载更多 / 没有更多数据了 */
  .loadmore{text-align:center;color:var(--muted);font-size:13px;padding:16px 0 8px;}
  .loadmore[hidden]{display:none;}

  /* PC：分页器（与列表留出呼吸感，不再贴住窗口底边） */
  .pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
         margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--stroke);}
  .pager[hidden]{display:none;}
  .pager .pages{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .pager .page{min-width:34px;justify-content:center;}
  .pager .page.active{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;color:#fff;}
  .pager .ellipsis{color:var(--muted);font-size:13px;padding:0 2px;}
  .pager .btn[disabled]{opacity:.4;cursor:not-allowed;}

  .modal{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:22px;z-index:50;animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal[hidden]{display:none;}
  .modal-card{
    position:relative;width:100%;max-width:340px;text-align:center;
    background:var(--glass-strong);border:1px solid var(--stroke);border-radius:20px;
    padding:26px 20px 20px;box-shadow:0 24px 60px var(--shadow);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  }
  .modal-card h2{font-size:16px;margin:0 0 16px;font-weight:600;}
  /* 设置标题旁的版本徽标：版本号 + 构建时间 */
  .settings-ver{
    display:inline-block;vertical-align:2px;margin-left:8px;
    font-size:11px;font-weight:500;line-height:1;
    padding:4px 8px;border-radius:99px;
    color:var(--muted);background:var(--glass-strong);
    border:1px solid var(--stroke);
  }
  .modal-close{
    position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--stroke);background:var(--glass-strong);color:var(--text);
    font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .modal-card img{width:210px;height:210px;border-radius:14px;background:#fff;padding:10px;display:block;margin:0 auto;}
  .modal-url{font-size:13px;color:var(--muted);margin:14px 0 16px;overflow-wrap:anywhere;word-break:break-all;}

  /* 设置弹窗：左对齐表单 */
  .settings-card{text-align:left;max-width:360px;}
  .field{display:block;margin:0 0 14px;}
  .field-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;}
  .field input{
    width:100%;padding:10px 12px;font-size:15px;font-weight:600;color:var(--text);
    background:var(--glass);border:1px solid var(--stroke);border-radius:12px;outline:none;
    font-variant-numeric:tabular-nums;
  }
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.20);}
  .field-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 18px;}
  .modal-actions{display:flex;gap:10px;}

  /* 设置弹窗内的 tab（通用 / 快捷键） */
  .set-tabs{display:flex;gap:4px;padding:4px;margin:0 0 16px;background:var(--glass);
            border:1px solid var(--stroke);border-radius:12px;}
  .set-tab{flex:1;appearance:none;-webkit-appearance:none;border:none;background:transparent;
           color:var(--muted);font-size:13.5px;font-weight:600;padding:7px 0;border-radius:9px;
           cursor:pointer;transition:background .15s ease,color .15s ease;}
  .set-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
  /* 开机自启：iOS 风格开关 */
  .switch-field{display:flex;align-items:center;justify-content:space-between;gap:10px;
                padding:2px 0 12px;border-bottom:1px solid var(--stroke);margin:0 0 14px;}
  .switch-field .field-label{margin:0;}
  .switch-wrap{display:inline-flex;align-items:center;gap:9px;cursor:pointer;position:relative;}
  .switch-wrap input{position:absolute;opacity:0;width:0;height:0;}
  .switch-ui{width:42px;height:25px;border-radius:13px;background:var(--glass-strong);
             border:1px solid var(--stroke);position:relative;transition:background .18s ease;flex:0 0 auto;display:block;}
  .switch-ui::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
                    background:var(--text);opacity:.85;transition:transform .18s ease,background .18s ease;}
  .switch-wrap input:checked + .switch-ui{background:linear-gradient(135deg,var(--primary),var(--primary2));}
  .switch-wrap input:checked + .switch-ui::after{transform:translateX(17px);background:#fff;opacity:1;}
  .switch-wrap input:focus-visible + .switch-ui{box-shadow:0 0 0 3px rgba(59,130,246,.25);}
  .switch-text{font-size:12px;color:var(--muted);}
  /* 快捷键展示行：右侧是可点击的「按键捕获」框 */
  .hk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
          padding:10px 2px;border-bottom:1px solid var(--stroke);}
  .hk-row:last-of-type{margin-bottom:14px;}
  .hk-name{font-size:13.5px;font-weight:600;color:var(--text);}
  kbd{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);
      background:var(--glass-strong);border:1px solid var(--stroke);border-radius:8px;
      padding:4px 9px;box-shadow:0 2px 5px var(--shadow);}
  .hk-capture{appearance:none;-webkit-appearance:none;border:1px dashed var(--stroke);
      background:var(--glass);border-radius:10px;padding:5px 10px;cursor:pointer;
      color:var(--text);transition:border-color .15s,box-shadow .15s;}
  .hk-capture:hover{border-color:var(--primary);}
  .hk-capture.listening{border-style:solid;border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(59,130,246,.25);animation:hkPulse 1.2s ease-in-out infinite;}
  @keyframes hkPulse{0%,100%{opacity:1}50%{opacity:.6}}
  .hk-capture[hidden]{display:none;}
  /* 历史记录浮层 */
  .history-card{max-width:420px;}
  .hist-sub{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:6px;}
  .hist-list{list-style:none;margin:0;padding:0;max-height:min(60vh,420px);overflow-y:auto;
             display:flex;flex-direction:column;gap:6px;}
  .hist-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
             background:var(--glass);border:1px solid var(--stroke);cursor:pointer;
             font-size:13px;color:var(--text);text-align:left;transition:background .15s ease,transform .08s ease;}
  .hist-item:hover{background:var(--glass-strong);}
  .hist-item:active{transform:scale(.985);}
  .hist-time{font-size:11px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums;}
  .hist-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff;flex:0 0 auto;}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translate(-50%,20px);
    background:var(--toast-bg);border:1px solid var(--stroke);color:var(--toast-text);font-size:14px;font-weight:500;
    padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s ease;z-index:60;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
  <header>
    <img class="hero-icon" src="/appicon.png" alt="" width="76" height="76">
    <h1>剪贴板</h1>
    <p class="hero-desc">电脑上复制一次，局域网内设备随时查看剪贴板记录</p>
  </header>

  <section class="card share">
    <div class="share-row">
      <button class="btn icon" id="qrBtn" title="分享二维码" aria-label="分享二维码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
          <rect x="3" y="14" width="7" height="7" rx="1.2"/>
          <path d="M14 14h3v3h-3zM20 14h1M14 20h1M18 18h3v3h-3z" stroke-width="1.6"/>
        </svg>
      </button>
      <span class="url" id="shareUrl">—</span>
      <button class="btn icon" id="copyLinkBtn" title="复制链接" aria-label="复制链接">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2.2"/>
          <path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/>
        </svg>
      </button>
    </div>
  </section>

  <section class="toolbar">
    <!-- 左翼：只剩计数（清空按钮已还原到右翼最右端） -->
    <span class="tb-side left">
      <span class="count" id="count">共 0 条记录</span>
    </span>
    <nav class="tabs" id="tabs" role="tablist" aria-label="记录类型">
      <button class="tab active" id="tabText" role="tab" aria-selected="true">文本<span class="tab-badge" id="badgeText"></span></button>
      <button class="tab" id="tabImage" role="tab" aria-selected="false">图片<span class="tab-badge" id="badgeImage"></span></button>
    </nav>
    <!-- 右翼：主题切换 → 设置 → 清空全部（清空在最右端） -->
    <span class="tb-side right">
      <button class="btn icon" id="themeBtn" title="切换暗色" aria-label="切换亮色/暗色">
        <!-- 亮色显示太阳、暗色显示月亮（主流做法：图标表示当前模式，点击切到另一模式） -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.9A9.2 9.2 0 1 1 11.1 3a7.2 7.2 0 0 0 9.9 9.9z"/>
        </svg>
      </button>
      <!-- 设置入口：仅 PC 且请求来自服务本机时显示（与「清空全部」同权限模型）。
           托盘菜单里的「设置」仍然可用，二者打开的是同一个弹窗。 -->
      <button class="btn icon" id="settingsBtn" title="设置" aria-label="设置" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.36 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.88z"/>
        </svg>
      </button>
      <!-- 清空按钮：同样仅服务本机可见；手机端两者都会从 DOM 移除 -->
      <button class="btn danger" id="clearBtn" hidden>清空全部文本</button>
    </span>
  </section>

  <ul class="list" id="list"></ul>
  <div class="loadmore" id="loadmore" hidden></div>
  <div class="empty" id="empty">暂无剪贴板记录，去电脑上复制点内容试试</div>

  <nav class="pager" id="pager" hidden>
    <button class="btn sm" id="prevPage">上一页</button>
    <span class="pages" id="pages"></span>
    <button class="btn sm" id="nextPage">下一页</button>
  </nav>

  <div class="modal" id="qrModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="访问二维码">
      <button class="modal-close" id="qrClose" aria-label="关闭">&times;</button>
      <h2>扫码在手机上打开</h2>
      <img id="qrImg" alt="访问地址二维码">
      <div class="modal-url" id="qrUrl"></div>
      <button class="btn primary block" id="qrCopy">复制链接</button>
    </div>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card settings-card" role="dialog" aria-modal="true" aria-label="设置">
      <button class="modal-close" id="settingsClose" aria-label="关闭">&times;</button>
      <h2>设置 <span class="settings-ver" id="settingsVer" hidden></span></h2>
      <div class="set-tabs" role="tablist">
        <button class="set-tab active" id="setTabGeneral" role="tab" aria-selected="true">通用</button>
        <button class="set-tab" id="setTabHotkey" role="tab" aria-selected="false">快捷键</button>
      </div>

      <!-- 通用：开机自启 + 保留条数 -->
      <div class="set-pane" id="setPaneGeneral">
        <label class="field switch-field" id="autostartField">
          <span class="field-label">开机自启</span>
          <span class="switch-wrap">
            <input type="checkbox" id="autostartInput" role="switch">
            <span class="switch-ui" aria-hidden="true"></span>
            <span class="switch-text" id="autostartText">开机后自动启动服务</span>
          </span>
        </label>
        <label class="field">
          <span class="field-label">文本保留条数</span>
          <input type="number" id="maxTextInput" min="10" max="5000" step="1" inputmode="numeric" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">图片保留条数</span>
          <input type="number" id="maxImageInput" min="5" max="1000" step="1" inputmode="numeric" autocomplete="off">
        </label>
        <p class="field-hint">保存后立即生效；数量超出时会优先删除最早的记录</p>
        <div class="modal-actions">
          <button class="btn block" id="settingsCancel">取消</button>
          <button class="btn primary block" id="settingsSave">保存</button>
        </div>
      </div>

      <!-- 快捷键：点击右侧组合键框 → 按下新组合 → 松开后回显；保存后生效 -->
      <div class="set-pane" id="setPaneHotkey" hidden>
        <div class="hk-row">
          <span class="hk-name">打开二维码</span>
          <button class="hk-capture" id="hkQRBtn" type="button" title="点击修改快捷键"><kbd id="hkQR"></kbd></button>
        </div>
        <div class="hk-row">
          <span class="hk-name">打开历史记录</span>
          <button class="hk-capture" id="hkHistBtn" type="button" title="点击修改快捷键"><kbd id="hkHistory"></kbd></button>
        </div>
        <p class="field-hint">点击组合键框后按下新组合，松开即回显，点「保存」生效；按 Esc 取消。快捷键在运行服务的电脑上全局生效，无需聚焦窗口；被系统占用的组合键可能无法注册。</p>
        <div class="modal-actions">
          <button class="btn block" id="hotkeyCancel">还原</button>
          <button class="btn primary block" id="hotkeySave">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 历史记录浮层（?history=1 或快捷键触发）：最近 30 条，点击复制回剪贴板 -->
  <div class="modal" id="historyModal" hidden>
    <div class="modal-card history-card" role="dialog" aria-modal="true" aria-label="剪贴板历史记录">
      <button class="modal-close" id="historyClose" aria-label="关闭">&times;</button>
      <h2>历史记录 <span class="hist-sub">最近 30 条 · 点击复制</span></h2>
      <ul class="hist-list" id="histList"></ul>
      <div class="empty" id="histEmpty" hidden>暂无剪贴板记录</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var shareUrlEl = document.getElementById('shareUrl');
  var shareEl = document.querySelector('.share');
  var clearBtn = document.getElementById('clearBtn');
  var settingsBtn = document.getElementById('settingsBtn');
  var modal = document.getElementById('qrModal');
  var qrImg = document.getElementById('qrImg');
  var qrUrl = document.getElementById('qrUrl');
  var settingsVerEl = document.getElementById('settingsVer');
  var toastEl = document.getElementById('toast');
  var pagerEl = document.getElementById('pager');
  var pagesEl = document.getElementById('pages');
  var prevBtn = document.getElementById('prevPage');
  var nextBtn = document.getElementById('nextPage');
  var loadmoreEl = document.getElementById('loadmore');
  var tabText = document.getElementById('tabText');
  var tabImage = document.getElementById('tabImage');
  var badgeText = document.getElementById('badgeText');
  var badgeImage = document.getElementById('badgeImage');
  var themeBtn = document.getElementById('themeBtn');
  var settingsModal = document.getElementById('settingsModal');
  var settingsClose = document.getElementById('settingsClose');
  var settingsCancel = document.getElementById('settingsCancel');
  var settingsSave = document.getElementById('settingsSave');
  var maxTextInput = document.getElementById('maxTextInput');
  var maxImageInput = document.getElementById('maxImageInput');
  var setTabGeneral = document.getElementById('setTabGeneral');
  var setTabHotkey = document.getElementById('setTabHotkey');
  var setPaneGeneral = document.getElementById('setPaneGeneral');
  var setPaneHotkey = document.getElementById('setPaneHotkey');
  var autostartField = document.getElementById('autostartField');
  var autostartInput = document.getElementById('autostartInput');
  var hkQR = document.getElementById('hkQR');
  var hkHistory = document.getElementById('hkHistory');
  var hkQRBtn = document.getElementById('hkQRBtn');
  var hkHistBtn = document.getElementById('hkHistBtn');
  var hotkeySave = document.getElementById('hotkeySave');
  var hotkeyCancel = document.getElementById('hotkeyCancel');
  var historyModal = document.getElementById('historyModal');
  var historyClose = document.getElementById('historyClose');
  var histList = document.getElementById('histList');
  var histEmpty = document.getElementById('histEmpty');

  var EMPTY_TEXT = { text: '暂无文本记录，去电脑上复制点内容试试', image: '暂无图片记录，去电脑上复制张图片试试' };

  var PAGE_SIZE = 10; // H5 每次上滑追加 10 条；PC 在下面按模式改成 32 条/页

  var state = {
    shareUrl:'', canClear:false, openIds:{},
    settings:{maxText:500, maxImage:200, autostart:false, autostartSupported:false},
    type:'text',      // 当前 tab：text | image（文本与图片分开分页）
    page:1,           // PC 当前页
    pages:1,          // H5 已加载页数
    total:0, totalPages:1, hasMore:false,
    firstSig:'',      // 第 1 页签名，用于轮询判断是否有新数据
    sig:'',           // 当前已渲染列表的签名
    loading:false,
  };

  // 手机端一律不展示「清空全部」并默认单列。UA 是第一判据，触摸能力只在
  // 「非桌面系统」时作为补充判据：iPadOS 13+ 的 Safari 会把自己伪装成
  // Macintosh，只能靠多点触控（真 Mac 为 0）识别；而触屏 Windows 笔记本 /
  // 一体机（Surface 等）虽然 maxTouchPoints > 0、pointer 也是 coarse，仍是
  // 本机桌面浏览器——早先只看触摸能力会把它误判成手机，导致清空按钮被移出
  // DOM、托盘「设置」的 ?settings=1 也不弹窗。
  var UA = navigator.userAgent;
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var touchy = (navigator.maxTouchPoints || 0) > 0 || coarse || 'ontouchstart' in window;
  var mobileUA = /Android|iPhone|iPod|iPad|Mobile|Windows Phone|MicroMessenger|HarmonyOS/i.test(UA);
  // iPadOS 13+：UA 写 Macintosh，但有多点触控（真 Mac 为 0，iPad 通常 5）
  var iPadLikeMac = /Macintosh/i.test(UA) && (navigator.maxTouchPoints || 0) > 1;
  // 明确的桌面系统不受触摸屏影响（Windows 平板拆键盘后仍按桌面处理）
  var desktopOS = /Windows NT|X11|CrOS/i.test(UA);
  var isMobile = mobileUA || iPadLikeMac || (touchy && !desktopOS);

  // PC 用页码分页 + 宽屏多列，H5 用上滑加载更多 + 单列
  var mode = isMobile ? 'h5' : 'pc';
  // 托盘「设置」会以 ?settings=1 打开本页并自动弹出设置弹窗；
  // 快捷键分别以 ?qr=1 / ?history=1 打开二维码弹窗 / 历史记录浮层
  var autoOpenSettings = /[?&]settings=1/.test(location.search);
  var autoOpenQR = /[?&]qr=1/.test(location.search);
  var autoOpenHistory = /[?&]history=1/.test(location.search);
  document.body.classList.add(mode === 'pc' ? 'is-pc' : 'is-h5');
  // 图片 tab 固定高度按模式取值（PC 200px / H5 240px），直接读 CSS 变量保证判断与样式一致；
  // 必须在 body 加上 is-pc/is-h5 之后再读，否则拿到的还是 :root 的 PC 值
  var SHOT_H = parseFloat(getComputedStyle(document.body).getPropertyValue('--shot-h')) || 200;
  // PC 每页 32 条（4 列 × 8 行），H5 每次追加 10 条
  if (mode === 'pc'){
    PAGE_SIZE = 32;
    listEl.classList.add('cols-4');
  }

  // 切换卡（文本/图片 tabs）与访问地址卡片严格等宽，PC/H5 一致：测量 .share 的实际
  // 渲染宽度写入 --feed-w，CSS 用 width 消费。URL 长短因机器而异，动态测量才能永远对齐。
  var feedWidth = 0;
  function syncFeedWidth(){
    if (!shareEl) return;
    var w = Math.ceil(shareEl.getBoundingClientRect().width);
    if (w > 0 && Math.abs(w - feedWidth) > 0.5){
      feedWidth = w;
      document.body.style.setProperty('--feed-w', w + 'px');
    }
  }
  // URL 文本可能因窗口宽度换行/收缩，resize 时重新测量保持对齐
  window.addEventListener('resize', syncFeedWidth);

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }

  // 时间戳统一带上年月日
  function fmtTime(ms){
    var d = new Date(ms);
    var p = function(v){ return v<10 ? '0'+v : ''+v; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // 告诉服务端「这条是从页面复制的，别再记一次」，避免产生重复记录。
  // 只有在服务本机（桌面浏览器）时才需要：手机复制走的不是这台电脑的剪贴板。
  function suppress(payload){
    if (!state.canClear) return Promise.resolve();
    return fetch('/api/suppress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function(){});
  }

  function copyText(text, okMsg){
    // 先上报再写剪贴板：保证 lancoclipWatcher 轮询到新内容时抑制已生效
    suppress({ kind: 'text', content: text }).then(function(){ writeLancoclipText(text, okMsg); });
  }

  function writeLancoclipText(text, okMsg){
    var done = function(){ toast(okMsg || '已复制'); };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(function(){ legacy(text, done); });
    } else { legacy(text, done); }
  }
  function legacy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }

  // 兜底：手动选中文字后 ⌘C / 右键「复制图片」也来自本页面，同样不记录
  document.addEventListener('copy', function(e){
    if (!state.canClear) return;
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.dataset && t.dataset.id){
      suppress({ kind: 'image', id: Number(t.dataset.id) });
      return;
    }
    var sel = window.getSelection ? String(window.getSelection()) : '';
    if (sel) suppress({ kind: 'text', content: sel });
  });

  function fetchPage(page, size){
    return fetch('/api/records?type=' + state.type + '&page=' + page + '&size=' + size, { cache:'no-store' })
      .then(function(r){ return r.json(); });
  }

  function sigOf(records){
    return JSON.stringify(records.map(function(r){ return [r.id, r.kind, r.content, r.imageSum]; }));
  }

  function render(records, append){
    if (!append) listEl.innerHTML = '';
    records.forEach(function(r){ appendItem(r); });
    emptyEl.hidden = state.total > 0;
    emptyEl.textContent = EMPTY_TEXT[state.type] || EMPTY_TEXT.text;
    countEl.textContent = '共 ' + state.total + ' 条记录';
  }

  function appendItem(r){
    var isImage = r.kind === 'image';
    var li = document.createElement('li');
    li.className = 'card item';
    li.dataset.id = r.id;   // 轮询去重：判断这条记录是否已在列表中

    // 头部一行：时间 + 展开 + 复制/保存
    var head = document.createElement('div');
    head.className = 'item-head';

    var t = document.createElement('span');
    t.className = 'time'; t.textContent = fmtTime(r.createdAt);
    head.appendChild(t);

    var spacer = document.createElement('span');
    spacer.className = 'spacer';
    head.appendChild(spacer);

    var toggle = document.createElement('button');
    toggle.className = 'toggle';
    toggle.hidden = true;
    toggle.textContent = state.openIds[r.id] ? '收起' : '展开';
    head.appendChild(toggle);

    if (isImage){
      var save = document.createElement('a');
      save.className = 'btn sm';
      save.textContent = '保存';
      save.href = '/api/image?id=' + r.id;
      save.setAttribute('download', 'lanoclip-' + r.id + '.png');
      head.appendChild(save);
    } else {
      var copyBtn = document.createElement('button');
      copyBtn.className = 'btn sm';
      copyBtn.textContent = '复制';
      copyBtn.addEventListener('click', function(){ copyText(r.content, '内容已复制'); });
      head.appendChild(copyBtn);
    }

    li.appendChild(head);

    // 内容体：文本用 <pre>，图片用 <img>
    var body;
    if (isImage){
      body = document.createElement('img');
      body.className = 'content shot';
      body.src = '/api/image?id=' + r.id;
      body.dataset.id = r.id;   // 右键「复制图片」时据此抑制重复记录
      body.alt = '剪贴板图片';
      body.loading = 'lazy';
    } else {
      body = document.createElement('pre');
      body.className = 'content';
      body.textContent = r.content;
    }
    var open = !!state.openIds[r.id];
    body.classList.add(open ? 'open' : 'clamp');
    li.appendChild(body);

    toggle.addEventListener('click', function(){
      var nowOpen = body.classList.toggle('open');
      body.classList.toggle('clamp', !nowOpen);
      if (nowOpen) { state.openIds[r.id] = true; toggle.textContent = '收起'; }
      else { delete state.openIds[r.id]; toggle.textContent = '展开'; }
    });

    listEl.appendChild(li);

    // 只有确实被截断时才显示「展开」。
    // 图片：固定高度 + contain，按当前渲染宽度换算完整高度，
    // 超出固定高度才需要展开（判据不依赖具体视口，PC 与手机结果一致）；
    // 文本：内容超过收起的一行才需要展开。
    var applyClamp = function(){
      if (open) return;
      var truncated = isImage
        ? (body.naturalWidth ? body.clientWidth * body.naturalHeight / body.naturalWidth : 0) > SHOT_H + 1
        : body.scrollHeight > body.clientHeight + 2;
      toggle.hidden = !truncated;
    };
    if (isImage){
      if (body.complete) applyClamp();
      else body.addEventListener('load', applyClamp, { once: true });
    } else {
      applyClamp();
    }
    return li;
  }

  // ── PC 分页器 ──────────────────────────────────────────────
  // 页码序列：总页数少时全列，多时用省略号收拢中间
  function pageButtons(cur, total){
    var out = [];
    if (total <= 7){
      for (var i = 1; i <= total; i++) out.push(i);
      return out;
    }
    out.push(1);
    var start = Math.max(2, cur - 1), end = Math.min(total - 1, cur + 1);
    if (start > 2) out.push('...');
    for (var j = start; j <= end; j++) out.push(j);
    if (end < total - 1) out.push('...');
    out.push(total);
    return out;
  }

  function renderPager(){
    if (mode !== 'pc' || state.totalPages <= 1){ pagerEl.hidden = true; return; }
    pagerEl.hidden = false;
    pagesEl.innerHTML = '';
    pageButtons(state.page, state.totalPages).forEach(function(p){
      if (p === '...'){
        var e = document.createElement('span');
        e.className = 'ellipsis'; e.textContent = '…';
        pagesEl.appendChild(e);
        return;
      }
      var b = document.createElement('button');
      b.className = 'btn sm page' + (p === state.page ? ' active' : '');
      b.textContent = p;
      b.addEventListener('click', function(){ gotoPage(p); });
      pagesEl.appendChild(b);
    });
    prevBtn.disabled = state.page <= 1;
    nextBtn.disabled = state.page >= state.totalPages;
  }

  function gotoPage(p){
    if (p < 1 || p > state.totalPages || p === state.page) return;
    state.page = p;
    loadView(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 切换 tab：重置分页状态后重新拉取（两个类型互不影响）
  function switchTab(type){
    if (type === state.type) return;
    state.type = type;
    state.page = 1;
    state.pages = 1;
    state.sig = '';
    state.firstSig = '';
    state.openIds = {};
    listEl.innerHTML = '';
    loadmoreEl.hidden = true;
    pagerEl.hidden = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    loadView(true);
  }

  // ── H5 上滑加载更多 ────────────────────────────────────────
  function setLoadMore(txt){ loadmoreEl.textContent = txt; }

  function updateLoadMore(hasMore){
    if (state.total === 0){ loadmoreEl.hidden = true; return; }
    loadmoreEl.hidden = false;
    if (hasMore){
      setLoadMore('上滑加载更多');
      // 内容不足一屏时自动补一页
      setTimeout(function(){
        if (!state.hasMore || state.loading) return;
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 240) loadMoreH5();
      }, 50);
    } else {
      setLoadMore('没有更多数据了');
    }
  }

  function loadMoreH5(){
    if (mode !== 'h5' || state.loading || !state.hasMore) return;
    state.loading = true;
    setLoadMore('加载中…');
    fetchPage(state.pages + 1, PAGE_SIZE).then(function(data){
      state.loading = false;
      state.pages++;
      state.total = data.total;
      state.totalPages = data.totalPages;
      state.hasMore = data.hasMore;
      state.sig += '||' + sigOf(data.records);
      render(data.records, true);
      updateLoadMore(state.hasMore);
    }).catch(function(){
      state.loading = false;
      setLoadMore('加载失败，点上滑重试');
    });
  }

  // ── 加载 / 轮询 ────────────────────────────────────────────
  function onMeta(data){
    // 设置弹窗标题旁的版本徽标：v版本 · 构建时间（本地开发构建 buildTime=dev 时只显示版本）
    if (data.version){
      var label = 'v' + data.version;
      if (data.buildTime && data.buildTime !== 'dev') label += ' · ' + data.buildTime;
      if (settingsVerEl.textContent !== label){
        settingsVerEl.textContent = label;
        settingsVerEl.hidden = false;
      }
    }

    // tab 上的数量
    if (data.counts){
      badgeText.textContent = data.counts.text || 0;
      badgeImage.textContent = data.counts.image || 0;
    }
    // 保留条数配置（设置弹窗回填用）
    if (data.settings){
      state.settings.maxText = data.settings.maxText || state.settings.maxText;
      state.settings.maxImage = data.settings.maxImage || state.settings.maxImage;
    }
    var isText = state.type === 'text';
    tabText.classList.toggle('active', isText);
    tabImage.classList.toggle('active', !isText);
    tabText.setAttribute('aria-selected', isText ? 'true' : 'false');
    tabImage.setAttribute('aria-selected', isText ? 'false' : 'true');

    // 清空按钮跟着当前 tab 走：清空全部文本 / 清空全部图片
    var clearLabel = isText ? '清空全部文本' : '清空全部图片';
    if (clearBtn.textContent !== clearLabel) clearBtn.textContent = clearLabel;

    state.canClear = !!data.canClear && !isMobile;

    // 托盘「设置」以 ?settings=1 打开本页：权限就绪后自动弹出设置弹窗（仅一次）
    if (autoOpenSettings && state.canClear){
      autoOpenSettings = false;
      openSettings();
    }
    // 快捷键触发：?qr=1 直接弹二维码；?history=1 打开历史记录浮层（均只弹一次）
    if (autoOpenQR && data.shareUrl){
      autoOpenQR = false;
      openModal();
    }
    if (autoOpenHistory && data.shareUrl){
      autoOpenHistory = false;
      openHistory();
    }

    if (data.shareUrl && data.shareUrl !== state.shareUrl){
      state.shareUrl = data.shareUrl;
      shareUrlEl.textContent = data.shareUrl;
      qrUrl.textContent = data.shareUrl;
      qrImg.src = '/api/qr?text=' + encodeURIComponent(data.shareUrl);
      syncFeedWidth(); // URL 文本落地后 .share 才有真实宽度，此时对齐列表列宽
    }

    // 手机端把按钮从 DOM 里彻底移除，不给任何重新显示的机会。
    // 设置入口与清空按钮同一套权限：仅 PC + 请求来自服务本机时显示。
    [settingsBtn, clearBtn].forEach(function(b){
      if (!b) return;
      if (isMobile && b.parentNode){
        b.parentNode.removeChild(b);
      } else {
        b.hidden = !state.canClear;
      }
    });
  }

  // 断线反馈：状态行已移除，改用页面已有的 toast 提示，不断线时静默
  function offline(){
    toast('连接断开，重试中…');
  }

  // 拉取并渲染「当前视图」：PC = 当前页；H5 = 已加载的全部页
  function loadView(force){
    if (state.loading) return;
    state.loading = true;
    var req = (mode === 'pc')
      ? fetchPage(state.page, PAGE_SIZE)
      : fetchPage(1, PAGE_SIZE * state.pages);

    req.then(function(data){
      state.loading = false;
      state.total = data.total;
      state.totalPages = data.totalPages;
      state.hasMore = data.hasMore;
      // 记录被清空 / 删除导致当前页越界时回到最后一页
      if (mode === 'pc' && state.page > data.totalPages){
        state.page = data.totalPages;
        state.loading = false;
        loadView(true);
        return;
      }
      onMeta(data);

      var sig = sigOf(data.records);
      if (force || sig !== state.sig){
        state.sig = sig;
        render(data.records, false);
      }
      if (mode === 'pc') renderPager();
      else { state.pages = Math.max(1, Math.ceil(data.records.length / PAGE_SIZE)); updateLoadMore(state.hasMore); }
    }).catch(offline);
  }

  // 轮询只看第 1 页：有变化再更新当前视图，既省流量又不打断阅读
  function poll(){
    fetchPage(1, PAGE_SIZE).then(function(data){
      var sig = sigOf(data.records);
      if (sig !== state.firstSig || data.total !== state.total){
        state.firstSig = sig;
        if (mode === 'pc' && state.page > 1){
          onMeta(data);           // 只在别的页时只更新状态信息
        } else if (mode === 'h5'){
          prependNewRecords(data); // H5 增量插入，不清空、不动滚动位置
        } else {
          loadView(false);
        }
      } else {
        onMeta(data);
      }
    }).catch(offline);
  }

  // H5 轮询到新记录：只把新记录插到列表顶部，不清空列表、不重置滚动位置。
  // 旧实现走 loadView(false) 全量重画（innerHTML=''），会把用户瞬间甩回顶部，
  // 还会把「上滑加载更多」已加载出来的多页数据一起抹掉。
  function prependNewRecords(data){
    onMeta(data);
    state.total = data.total;
    var known = {};
    var nodes = listEl.children;
    for (var i = 0; i < nodes.length; i++){
      var id = nodes[i].dataset && nodes[i].dataset.id;
      if (id) known[id] = true;
    }
    var fresh = [];
    (data.records || []).forEach(function(r){
      if (!known[r.id]) fresh.push(r);
    });
    if (fresh.length){
      // 服务端返回「最新在前」：倒序插入，最终 DOM 顺序才是「最新的在最上面」
      for (var i = fresh.length - 1; i >= 0; i--){
        listEl.insertBefore(appendItem(fresh[i]), listEl.firstChild);
      }
    }
    emptyEl.hidden = state.total > 0;
    countEl.textContent = '共 ' + state.total + ' 条记录';
  }

  // 托盘「设置」/ 快捷键是以 ?settings=1 / ?qr=1 / ?history=1 打开本页的。
  // 弹窗关掉后要把这个参数从地址栏抹掉：否则浏览器里一直留着一个同 URL 的
  // 标签页，下次再点托盘「设置」只会切换到它、不会重新加载页面，弹窗也就不
  // 会再出现（看起来像「点了设置没反应」）。
  function clearAutoParam(){
    if (!/[?&](settings|qr|history)=1/.test(location.search)) return;
    var kept = location.search.replace(/^\?/, '').split('&').filter(function(kv){
      return kv && kv !== 'settings=1' && kv !== 'qr=1' && kv !== 'history=1';
    });
    try {
      history.replaceState(null, '', location.pathname + (kept.length ? '?' + kept.join('&') : ''));
    } catch(e) {}
  }

  function openModal(){ modal.hidden = false; }
  function closeModal(){ modal.hidden = true; clearAutoParam(); }

  // ── 设置弹窗：通用 / 快捷键 双 tab ────────────────────────
  // 快捷键可自定义：点击组合键框 → 按下新组合 → 松开后回显；保存后服务端
  // 重注册（canonical 形如 "meta+shift+q"，meta 在 Mac 上是 ⌘、Windows 上是 Win 键）
  var isMac = /Mac|iPhone|iPad|iPod/i.test(UA);
  var hkModNames = isMac ? { meta:'⌘', ctrl:'⌃', alt:'⌥', shift:'⇧' }
                         : { meta:'Win', ctrl:'Ctrl', alt:'Alt', shift:'Shift' };
  // 未拿到服务端值前先按平台默认显示
  state.settings.hotkeyQR = isMac ? 'meta+shift+q' : 'ctrl+shift+q';
  state.settings.hotkeyHistory = isMac ? 'meta+shift+v' : 'ctrl+shift+v';
  var pendingHK = { qr: null, hist: null }; // 捕获到、尚未保存的组合键
  var hkCapture = null;                     // { which:'qr'|'hist', mods:{}, key:null }

  function fmtCombo(str){
    if (!str) return '—';
    return str.split('+').map(function(t){
      if (hkModNames[t]) return hkModNames[t];
      if (t === 'space') return 'Space';
      return t.toUpperCase();
    }).join(' + ');
  }
  function setHKLabel(which, text){
    (which === 'qr' ? hkQR : hkHistory).textContent = text;
  }
  function refreshHK(){
    setHKLabel('qr', fmtCombo(pendingHK.qr !== null ? pendingHK.qr : state.settings.hotkeyQR));
    setHKLabel('hist', fmtCombo(pendingHK.hist !== null ? pendingHK.hist : state.settings.hotkeyHistory));
  }
  function keyToken(e){
    var k = e.key;
    if (/^[a-z]$/i.test(k)) return k.toLowerCase();
    if (/^[0-9]$/.test(k)) return k;
    if (/^f([1-9]|1[0-9]|2[0-4])$/i.test(k)) return k.toLowerCase();
    if (k === ' ') return 'space';
    if (['-','=','[',']',';',"'",',','.','/','\\','`'].indexOf(k) >= 0) return k;
    return null;
  }
  function isModKey(k){ return k === 'Meta' || k === 'Control' || k === 'Alt' || k === 'Shift'; }
  function canonCombo(mods, key){
    var parts = [];
    if (mods.meta) parts.push('meta');
    if (mods.ctrl) parts.push('ctrl');
    if (mods.alt) parts.push('alt');
    if (mods.shift) parts.push('shift');
    if (!parts.length) return '';
    parts.push(key);
    return parts.join('+');
  }

  function startHKCapture(which){
    if (!state.canClear || isMobile){
      toast('请在运行服务的电脑上修改快捷键');
      return;
    }
    endHKCapture();
    hkCapture = { which: which, mods: null, key: null };
    (which === 'qr' ? hkQRBtn : hkHistBtn).classList.add('listening');
    setHKLabel(which, '请按下组合键…');
  }
  function endHKCapture(){
    if (!hkCapture) return;
    hkCapture = null;
    hkQRBtn.classList.remove('listening');
    hkHistBtn.classList.remove('listening');
    refreshHK();
  }
  function hkKeydown(e){
    if (!hkCapture) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.key === 'Escape'){ endHKCapture(); toast('已取消修改'); return; }
    var mods = { meta: e.metaKey, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey };
    var tok = keyToken(e);
    if (tok){
      hkCapture.mods = mods; hkCapture.key = tok;
      // 实时回显（即使还缺修饰键，松手后统一校验提示）
      setHKLabel(hkCapture.which, fmtCombo(canonCombo(mods, tok) || tok));
      return;
    }
    if (isModKey(e.key)){
      hkCapture.mods = mods;
      var parts = [];
      if (mods.meta) parts.push(hkModNames.meta);
      if (mods.ctrl) parts.push(hkModNames.ctrl);
      if (mods.alt) parts.push(hkModNames.alt);
      if (mods.shift) parts.push(hkModNames.shift);
      setHKLabel(hkCapture.which, (parts.length ? parts.join(' + ') + ' + ' : '') + '…');
    }
  }
  function hkKeyup(e){
    if (!hkCapture) return;
    e.preventDefault(); e.stopImmediatePropagation();
    var tok = keyToken(e);
    // 修饰键先松开、或主键未按下：继续等待
    if (!tok || tok !== hkCapture.key) return;
    var combo = canonCombo(hkCapture.mods, tok);
    var which = hkCapture.which;
    hkCapture = null;
    hkQRBtn.classList.remove('listening');
    hkHistBtn.classList.remove('listening');
    if (!combo){
      toast('需要包含 Cmd/Ctrl/Alt 修饰键，已取消');
      refreshHK();
      return;
    }
    pendingHK[which] = combo;
    setHKLabel(which, fmtCombo(combo));
  }
  // 捕获阶段注册：按下组合键期间拦截页面所有其他键盘行为
  document.addEventListener('keydown', hkKeydown, true);
  document.addEventListener('keyup', hkKeyup, true);
  window.addEventListener('blur', endHKCapture);
  hkQRBtn.addEventListener('click', function(){ startHKCapture('qr'); });
  hkHistBtn.addEventListener('click', function(){ startHKCapture('hist'); });

  function showSettingsTab(which){
    var general = which === 'general';
    setTabGeneral.classList.toggle('active', general);
    setTabHotkey.classList.toggle('active', !general);
    setTabGeneral.setAttribute('aria-selected', general ? 'true' : 'false');
    setTabHotkey.setAttribute('aria-selected', general ? 'false' : 'true');
    setPaneGeneral.hidden = !general;
    setPaneHotkey.hidden = general;
  }
  setTabGeneral.addEventListener('click', function(){ showSettingsTab('general'); });
  setTabHotkey.addEventListener('click', function(){ showSettingsTab('hotkey'); });

  // 保存快捷键：只提交 hotkeyQR / hotkeyHistory，服务端校验并重注册
  hotkeySave.addEventListener('click', function(){
    if (hkCapture) endHKCapture();
    var changed = pendingHK.qr !== null || pendingHK.hist !== null;
    if (!changed){ closeSettings(); return; }
    var payload = {
      hotkeyQR: pendingHK.qr !== null ? pendingHK.qr : state.settings.hotkeyQR,
      hotkeyHistory: pendingHK.hist !== null ? pendingHK.hist : state.settings.hotkeyHistory,
    };
    fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, j: j }; });
    }).then(function(res){
      if (!res.ok){ toast(res.j.error || '保存失败'); return; }
      state.settings.hotkeyQR = res.j.hotkeyQR;
      state.settings.hotkeyHistory = res.j.hotkeyHistory;
      pendingHK = { qr: null, hist: null };
      refreshHK();
      toast('快捷键已保存，立即生效');
    }).catch(function(){ toast('操作失败'); });
  });
  // 还原：丢弃未保存的修改（endHKCapture 在未捕获时是 no-op，需主动刷新显示）
  hotkeyCancel.addEventListener('click', function(){
    pendingHK = { qr: null, hist: null };
    endHKCapture();
    refreshHK();
  });

  function openSettings(){
    showSettingsTab('general');
    maxTextInput.value = state.settings.maxText;
    maxImageInput.value = state.settings.maxImage;
    // 自启状态实时拉取（可能在程序外被改动）；无权限/手机端直接隐藏该行
    autostartField.hidden = !state.canClear;
    // 快捷键：还原未保存修改、按权限显隐捕获框，并实时拉取当前组合
    endHKCapture();
    pendingHK = { qr: null, hist: null };
    refreshHK();
    hkQRBtn.hidden = !state.canClear || isMobile;
    hkHistBtn.hidden = hkQRBtn.hidden;
    if (state.canClear){
      fetch('/api/settings', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
        state.settings.autostartSupported = !!j.autostartSupported;
        state.settings.autostart = !!j.autostart;
        autostartField.hidden = !state.canClear || !state.settings.autostartSupported;
        autostartInput.checked = state.settings.autostart;
        if (j.hotkeyQR) state.settings.hotkeyQR = j.hotkeyQR;
        if (j.hotkeyHistory) state.settings.hotkeyHistory = j.hotkeyHistory;
        refreshHK();
      }).catch(function(){});
    }
    settingsModal.hidden = false;
  }
  function closeSettings(){ settingsModal.hidden = true; clearAutoParam(); }

  document.getElementById('qrBtn').addEventListener('click', openModal);
  document.getElementById('qrClose').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
  settingsClose.addEventListener('click', closeSettings);
  settingsCancel.addEventListener('click', closeSettings);
  settingsModal.addEventListener('click', function(e){ if (e.target === settingsModal) closeSettings(); });

  // ── 历史记录浮层（?history=1 / 快捷键触发）────────────────
  // 最近 30 条（与托盘「历史」一致）：文本预览或图片缩略图，点击复制回剪贴板
  function fmtHistTime(ms){
    var d = new Date(ms), now = new Date();
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return (d.toDateString() === now.toDateString()) ? hm
      : (pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm);
  }

  function copyImageToLancoclip(id){
    // 与列表页一致：先上报抑制（本机复制不再入库），再写剪贴板
    suppress({ kind: 'image', id: id }).then(function(){
      fetch('/api/image?id=' + id).then(function(r){ return r.blob(); }).then(function(blob){
        if (!navigator.clipboard || typeof ClipboardItem === 'undefined'){
          toast('当前浏览器不支持复制图片'); return;
        }
        return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function(){ toast('图片已复制'); })
          .catch(function(){ toast('复制图片失败'); });
      }).catch(function(){ toast('复制图片失败'); });
    });
  }

  function openHistory(){
    histList.innerHTML = '';
    histEmpty.hidden = true;
    historyModal.hidden = false;
    fetch('/api/recent?limit=30', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var recs = data.records || [];
        if (!recs.length){ histEmpty.hidden = false; return; }
        recs.forEach(function(r){
          var li = document.createElement('li');
          li.className = 'hist-item';
          var t = document.createElement('span');
          t.className = 'hist-time';
          t.textContent = fmtHistTime(r.createdAt);
          li.appendChild(t);
          if (r.kind === 'image'){
            var img = document.createElement('img');
            img.className = 'hist-thumb';
            img.src = '/api/image?id=' + r.id;
            img.alt = '[图片]';
            img.loading = 'lazy';
            li.appendChild(img);
            var label = document.createElement('span');
            label.className = 'hist-text';
            label.textContent = '[图片]';
            li.appendChild(label);
            li.addEventListener('click', function(){ copyImageToLancoclip(r.id); });
          } else {
            var text = document.createElement('span');
            text.className = 'hist-text';
            var content = String(r.content || '');
            text.textContent = content.length > 80 ? content.slice(0, 80) + '…' : content;
            li.title = content;
            li.appendChild(text);
            li.addEventListener('click', function(){ copyText(content, '已复制'); });
          }
          histList.appendChild(li);
        });
      })
      .catch(function(){ toast('加载历史记录失败'); });
  }
  function closeHistory(){ historyModal.hidden = true; clearAutoParam(); }
  historyClose.addEventListener('click', closeHistory);
  historyModal.addEventListener('click', function(e){ if (e.target === historyModal) closeHistory(); });

  // ── 亮色 / 暗色切换 ────────────────────────────────────────
  // 默认跟随系统（首帧由 head 内联脚本决定）；用户手动点过按钮后，
  // 选择存入 localStorage，此后按用户设置展示、不再跟随系统变化。
  // 手机端同样可用（纯展示偏好，不涉及管理权限）。
  var THEME_KEY = 'lanoclip-theme';
  var darkMedia = matchMedia('(prefers-color-scheme: dark)');
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function applyTheme(mode){ // 'system' | 'light' | 'dark'
    var dark = mode === 'dark' || (mode === 'system' && darkMedia.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.title = dark ? '切换亮色' : '切换暗色';
    // 同步 iOS 状态栏/地址栏配色（手动切换后不再跟随系统 media 查询）
    var tc = document.getElementById('themeColorMeta');
    if (tc) tc.setAttribute('content', dark ? '#0f1626' : '#eef2fb');
  }
  try{
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'light' || savedTheme === 'dark'){
      applyTheme(savedTheme);
    } else {
      applyTheme('system');
      // 没手动设置过才跟随系统实时变化
      darkMedia.addEventListener('change', function(e){
        if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
      });
    }
  }catch(e){ applyTheme('system'); }
  themeBtn.addEventListener('click', function(){
    var next = isDark() ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });
  // 输入框内回车 = 点保存
  [maxTextInput, maxImageInput].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); settingsSave.click(); }
    });
  });
  // ESC 关当前打开的弹窗（设置 > 历史 > 二维码）；正在捕获快捷键时交给捕获逻辑
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (hkCapture) return;
    if (!settingsModal.hidden) closeSettings();
    else if (!historyModal.hidden) closeHistory();
    else if (!modal.hidden) closeModal();
  });

  document.getElementById('copyLinkBtn').addEventListener('click', function(){ copyText(state.shareUrl, '链接已复制'); });
  document.getElementById('qrCopy').addEventListener('click', function(){ copyText(state.shareUrl, '链接已复制'); });

  prevBtn.addEventListener('click', function(){ gotoPage(state.page - 1); });
  nextBtn.addEventListener('click', function(){ gotoPage(state.page + 1); });

  tabText.addEventListener('click', function(){ switchTab('text'); });
  tabImage.addEventListener('click', function(){ switchTab('image'); });

  // 页面右上角设置入口（仅 PC + 本机可见）：与托盘「设置」打开同一个弹窗
  if (settingsBtn) settingsBtn.addEventListener('click', openSettings);

  clearBtn.addEventListener('click', function(){
    var label = state.type === 'image' ? '图片' : '文本';
    if (!confirm('确定清空全部' + label + '记录？')) return;
    fetch('/api/clear?type=' + state.type, { method:'POST' }).then(function(r){
      if (r.ok){
        toast('已清空全部' + label + '记录');
        state.page = 1; state.pages = 1; state.sig = ''; state.firstSig = '';
        loadView(true);
      } else { toast('无权限清空'); }
    }).catch(function(){ toast('操作失败'); });
  });

  // 保存设置：保留条数 + 开机自启一起提交，服务端立即生效
  settingsSave.addEventListener('click', function(){
    var t = parseInt(maxTextInput.value, 10);
    var i = parseInt(maxImageInput.value, 10);
    if (!isFinite(t) || !isFinite(i) || t < 10 || t > 5000 || i < 5 || i > 1000){
      toast('请输入有效范围：文本 10–5000，图片 5–1000');
      return;
    }
    var payload = { maxText: t, maxImage: i };
    var autostartChanged = state.canClear && state.settings.autostartSupported
      && autostartInput.checked !== state.settings.autostart;
    if (autostartChanged) payload.autostart = autostartInput.checked;
    fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, j: j }; });
    }).then(function(res){
      if (!res.ok){ toast(res.j.error || '保存失败'); return; }
      if (res.j.maxText !== undefined){
        state.settings.maxText = res.j.maxText;
        state.settings.maxImage = res.j.maxImage;
      }
      if (res.j.autostart !== undefined) state.settings.autostart = res.j.autostart;
      var trimmed = (res.j.trimmedText || 0) + (res.j.trimmedImage || 0);
      var msg = trimmed > 0 ? ('已保存，清理 ' + trimmed + ' 条最早记录') : '已保存，立即生效';
      if (payload.autostart !== undefined){
        msg = autostartInput.checked ? '已保存，开机自动启动' : '已保存，已关闭开机自启';
      }
      toast(msg);
      closeSettings();
      state.page = 1; state.pages = 1; state.sig = ''; state.firstSig = '';
      loadView(true);
    }).catch(function(){ toast('操作失败'); });
  });

  if (mode === 'h5'){
    window.addEventListener('scroll', function(){
      if (state.loading || !state.hasMore) return;
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 240) loadMoreH5();
    }, { passive: true });
  }

  loadView(true);
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
